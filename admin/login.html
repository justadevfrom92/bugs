<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin Sign In</title>
  <link rel="stylesheet" href="_app/admin.css">
  <script src="../shared/boot.js" data-then="_app/login.js"></script>
</head>
<body>
  <div class="login-wrap">
    <form class="login" id="login" novalidate>
      <div class="brand">
        <svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="23" fill="#00AEEF"/><path d="M24 7l4.6 10.3 11.2 1.1-8.4 7.5 2.4 11L24 31.3 14.2 37l2.4-11-8.4-7.5 11.2-1.1z" fill="#102247"/><path d="M26.5 14l-6 11h4.3l-2.3 9 7.5-12.2h-4.6z" fill="#fff"/></svg>
        <div><strong data-wordmark></strong><span>Admin Tools</span></div>
      </div>
      <div class="banner-note">Demo sign-in. There is no real authentication yet: use a sample user (admin@example.com) and any password.</div>
      <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" list="users"></div>
      <datalist id="users"></datalist>
      <div class="field"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password"></div>
      <div class="err" id="err" role="alert"></div>
      <button class="btn cyan">Sign In</button>
      <a href="../index.html" class="muted" style="text-align:center;font-size:.85rem">← Back to website</a>
    </form>
  </div>
</body>
</html>
