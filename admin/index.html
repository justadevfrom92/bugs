<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin</title>
  <link rel="stylesheet" href="_app/admin.css">
  <script src="../shared/boot.js" data-then="_app/launcher.js"></script>
</head>
<body>
  <div class="launcher">
    <header class="launcher-top"><div class="in">
      <div class="brand"><img src="../shared/img/logo-mark-on-dark.svg" alt="" width="36" height="36"><div><strong data-wordmark></strong><span>Admin Tools</span></div></div>
      <div class="user-chip"><span class="avatar" id="user-initials"></span><span><span id="user-name"></span><small id="user-role"></small></span></div>
      <a class="btn sm ghost" href="#" id="logout">Logout</a>
    </div></header>
    <main class="launcher-main">
      <div class="page-head"><div><h1 id="greeting">Admin Tools</h1><p class="muted">Choose an app. You see the apps your role allows.</p></div>
        <div class="actions"><a class="btn ghost" id="site-link" href="../index.html">View website</a></div></div>
      <div class="banner-note" id="denied" hidden></div>
      <div class="tiles" id="tiles"></div>
    </main>
  </div>
</body>
</html>
