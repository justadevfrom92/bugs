<!DOCTYPE html>
<!--
  The one page every admin app uses. admin/<app>/index.html is a symlink to this
  file; the app's own config.js (next to the link) decides its name and menu.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin</title>
  <link rel="stylesheet" href="../_app/admin.css">
  <script src="../../shared/boot.js" data-then="config.js ../_app/sample-data.js ../_app/shell.js"></script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="23" fill="#00AEEF"/><path d="M24 7l4.6 10.3 11.2 1.1-8.4 7.5 2.4 11L24 31.3 14.2 37l2.4-11-8.4-7.5 11.2-1.1z" fill="#102247"/><path d="M26.5 14l-6 11h4.3l-2.3 9 7.5-12.2h-4.6z" fill="#fff"/></svg>
        <div><strong id="brand-name"></strong><span>Admin Tools</span></div>
      </div>
      <span class="env">DEMO</span>
      <nav class="app-switch" id="app-switch" aria-label="Apps"></nav>
      <div class="nav-search"><input id="find" type="search" placeholder="Find a menu item…" aria-label="Find a menu item"></div>
      <nav class="menu" id="menu" aria-label="Menu"></nav>
      <div class="side-foot"><a href="../">← All apps</a><a href="#" id="site-link" target="_blank" rel="noopener">Website</a><a href="#" id="reset">Reset data</a></div>
    </aside>
    <div class="main">
      <header class="topbar">
        <button class="menu-btn" id="menu-btn" aria-label="Open menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
        <div class="crumbs" id="crumbs"></div>
        <div class="user-chip"><span class="avatar" id="user-initials"></span><span><span id="user-name"></span><small id="user-role"></small></span></div>
        <a class="btn sm ghost" href="#" id="logout">Logout</a>
      </header>
      <main class="content" id="content"></main>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
